# Starter repo CI: Day 4 ordering (unit → integration) + Day 5 (REST Assured Failsafe + Newman).
# Optional repo variable: API_BASE_URL (Settings → Secrets and variables → Actions → Variables).
# Leave unset in GitHub to use WireMock inside UserApiIT (no external API for the Java suite).

name: Starter — unit, API (REST Assured), integration, Newman

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (exclude integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Run unit tests
        run: |
          chmod +x mvnw
          ./mvnw -B test -DexcludedGroups=integration

      - name: Upload Surefire XML (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-unit-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: warn

  api-tests:
    name: REST Assured (Failsafe, groups=api)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run API integration tests
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Papi-only

      - name: Upload Failsafe reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-api-${{ github.run_id }}
          path: target/failsafe-reports/
          if-no-files-found: warn

  integration-tests:
    name: Integration tests
    needs: api-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run integration-tagged tests
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dgroups=integration

      - name: Upload Surefire XML (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-integration-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: warn

  newman-api:
    name: Newman (Postman collection)
    needs: api-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Newman (project devDependency)
        run: npm install

      - name: Run collection
        run: npm run newman

      - name: Upload Newman JUnit (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-junit-${{ github.run_id }}
          path: postman/results/newman-junit.xml
          if-no-files-found: warn
