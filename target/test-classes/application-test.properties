# Day 6 env contract (slides): override via DB_* in Compose / CI.
# Plain JDBC tests read env vars directly; Spring Boot tests use spring.datasource.* when JPA/JDBC is enabled.
db.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
db.user=${DB_USER:sa}
db.pass=${DB_PASS:}

spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Disable actual external integrations during tests
app.notifications.enabled=false
app.payment.gateway=sandbox
